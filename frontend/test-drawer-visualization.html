<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Visualisation Drawers - Debug Mode</title>
    <link rel="stylesheet" href="assets/css/drawer-visualization.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            /* Matrice 6x8 stricte */
            gap: 4px;
            /* Espacement plus fin comme sur la vraie table */
            margin-top: 20px;
            background: #2c3e50;
            /* Fond sombre comme socle */
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #34495e;
        }

        .status {
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.success {
            background: #d5f4e6;
            color: #27ae60;
            border-left: 5px solid #27ae60;
        }

        .status.error {
            background: #fadbd8;
            color: #e74c3c;
            border-left: 5px solid #e74c3c;
        }

        .status.info {
            background: #d6eaf8;
            color: #3498db;
            border-left: 5px solid #3498db;
        }

        .status.warning {
            background: #fcf3cf;
            color: #f1c40f;
            border-left: 5px solid #f1c40f;
        }

        #debug-console {
            margin-top: 20px;
            padding: 15px;
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Consolas', monospace;
            height: 200px;
            overflow-y: auto;
            border-radius: 5px;
            font-size: 12px;
            border: 1px solid #333;
        }

        #debug-console div {
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #eee;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }

        .legend-box.active {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .legend-box.inactive {
            background: #f8f9fa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎨 Test Visualisation Drawers - Debug Mode</h1>

        <div id="status-messages"></div>

        <div class="controls">
            <button class="btn-primary" onclick="loadStructure('mundo')">📊 Charger Mundo (API)</button>
            <button class="btn-danger" onclick="forceFallback()">🚑 Forcer Mode Secours</button>
            <button class="btn-success" onclick="simulateDrawerMode()">🎯 Mode DRAWER</button>
            <button class="btn-warning" onclick="simulateChipMode()">🔢 Mode CHIP</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box active"></div><span>Actif</span>
            </div>
            <div class="legend-item">
                <div class="legend-box inactive"></div><span>Inactif</span>
            </div>
        </div>

        <div id="grid-container">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">
                En attente de chargement...
            </div>
        </div>

        <div id="debug-console">
            <div>> Console initialisée...</div>
        </div>
    </div>

    <script src="assets/js/drawer-visualization.js"></script>
    <script>
        // --- Console Override ---
        const originalLog = console.log;
        const originalError = console.error;
        const debugDiv = document.getElementById('debug-console');

        function logToScreen(msg, type = 'log') {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${msg}`;
            if (type === 'error') {
                div.style.color = '#ff5555';
                div.style.fontWeight = 'bold';
            }
            if (type === 'warn') div.style.color = '#ffff55';

            debugDiv.appendChild(div);
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        console.log = function (...args) {
            originalLog.apply(console, args);
            // Convert objects to string for display
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            logToScreen(msg);
        };

        console.error = function (...args) {
            originalError.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            logToScreen(msg, 'error');
        };

        // --- DEFINITION DES FONCTIONS ---

        function showStatus(message, type = 'info') {
            const container = document.getElementById('status-messages');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            container.appendChild(statusDiv);
            console.log(`STATUS: ${message}`);
            // Auto remove old statuses
            if (container.children.length > 3) container.firstChild.remove();
        }

        // --- Logic (Variables renommées pour éviter conflit) ---
        // !!! IMPORTANT : Ne pas utiliser 'currentUniverse' ou 'currentMode' car utilisés dans la lib
        let pageSelectedMode = 'drawer';
        let pageSelectedUniverse = 'mundo';

        // Données de secours hardcodées pour être sûr d'afficher quelque chose si l'API plante
        const FALLBACK_STRUCTURE = {
            "chip1": [
                { "drawer_name": "drawer1", "forme": "carre", "denomination": "Fallback Tbl" },
                { "drawer_name": "drawer2", "forme": "triangle", "denomination": "Fallback Frst" },
                { "drawer_name": "drawer3", "forme": "cercle", "denomination": "Fallback Shs" },
                { "drawer_name": "drawer4", "forme": "rectangle", "denomination": "Fallback Gld" }
            ],
            "chip10": [
                { "drawer_name": "drawer34", "forme": "carre", "denomination": "Fallback" },
                { "drawer_name": "drawer35", "forme": "triangle", "denomination": "Fallback" }
            ]
        };

        async function loadStructure(universe) {
            pageSelectedUniverse = universe;
            showStatus(`Tentative chargement ${universe}...`, 'info');

            try {
                // Check if module loaded
                if (typeof loadChipDrawerStructure === 'undefined') {
                    throw new Error("Module drawer-visualization.js non chargé !");
                }

                const structure = await loadChipDrawerStructure(universe);

                if (!structure || Object.keys(structure).length === 0) {
                    throw new Error("API a retourné une structure vide");
                }

                showStatus(`Succès API ! ${Object.keys(structure).length} chips chargés`, 'success');
                if (pageSelectedMode === 'drawer') {
                    simulateDrawerMode();
                }

            } catch (error) {
                console.error("ERREUR CRITIQUE:", error.message);
                showStatus(`Echec chargement: ${error.message}`, 'error');
                forceFallback();
            }
        }

        function forceFallback() {
            console.log("Activation du mode SECOURS (Données locales)");
            window._fallbackMode = true;
            showStatus("Mode Secours activé", 'warning');
            simulateDrawerMode();
        }

        function simulateDrawerMode() {
            pageSelectedMode = 'drawer';
            console.log('Génération visuelle Mode DRAWER...');
            const container = document.getElementById('grid-container');
            container.innerHTML = ''; // Clear

            const tableData = {
                markingType: 'drawer',
                universe: pageSelectedUniverse,
                occurrences: {}
            };

            // Fake data
            const activeDrawerSamples = [
                { chipNumber: 1, drawer_name: 'drawer1', forme: 'carre', count: 3 },
                { chipNumber: 1, drawer_name: 'drawer3', forme: 'cercle', count: 1 },
                { chipNumber: 10, drawer_name: 'drawer34', forme: 'carre', count: 2 }
            ];

            activeDrawerSamples.forEach(({ chipNumber, drawer_name, forme, count }) => {
                if (!tableData.occurrences[chipNumber]) tableData.occurrences[chipNumber] = { drawers: [] };
                tableData.occurrences[chipNumber].drawers.push({ drawer_name, forme, count });
            });

            try {
                let html = generateMiniKatulaGridDrawerMode(tableData);

                if (!html || html.length < 100) {
                    console.log("Rendu vide détecté, tentative avec structure fallback...");
                    if (window._fallbackMode) {
                        html = localFallbackGenerator(tableData);
                    }
                }

                container.innerHTML = html;
                console.log("Injection DOM terminée.");

            } catch (e) {
                console.error("Erreur durant la génération:", e);
                container.innerHTML = `<div style="color:red">Erreur JS: ${e.message}</div>`;
            }
        }

        function localFallbackGenerator(tableData) {
            console.log("Utilisation générateur local de secours");
            let html = '';
            for (let i = 1; i <= 20; i++) {
                const drawers = FALLBACK_STRUCTURE[`chip${i}`] || [];
                let items = drawers.map(d => `
                    <div class="drawer-item inactive" style="border:1px solid #ccc; margin:2px; padding:2px;">
                        ${d.forme.charAt(0).toUpperCase()} ${d.drawer_name}
                    </div>`).join('');

                if (!items && i === 1) items = '<div>Fallback Data Missing</div>';
                if (!items) items = '<div class="no-drawers">Aucun drawer (Secours)</div>';

                html += `<div class="mini-chip-cell drawer-mode vertical-list">
                            <div class="chip-number-header">${i}</div>
                            <div class="drawer-list-container">${items}</div>
                         </div>`;
            }
            return html;
        }

        function simulateChipMode() {
            pageSelectedMode = 'chip';
            console.log('Génération Mode CHIP...');
            const tableData = {
                markingType: 'chip',
                title: 'Test Chip Mode',
                universe: pageSelectedUniverse,
                occurrences: {}
            };
            [1, 5, 10].forEach(c => tableData.occurrences[c] = { count: 3, attributes: [] });

            const html = generateMiniKatulaGridChipMode(tableData);
            document.getElementById('grid-container').innerHTML = html;
        }

        window.addEventListener('load', () => {
            console.log("Page prête. Initialisation...");
            loadStructure('mundo');
        });
    </script>
</body>

</html>
