<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Katula Modulaire</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🧪 Test des Modules Katula</h1>
    
    <div id="testResults"></div>
    
    <button onclick="testModules()">Tester les Modules</button>
    <button onclick="testAPI()">Tester l'API</button>

    <script type="module">
        import { FORME_ICONS, FORME_COLORS } from './assets/js/katulaConstants.js';
        import { loadUniverseData } from './assets/js/katulaLoader.js';
        import { renderKatulaGrid } from './assets/js/katulaRenderer.js';
        import { getChipFrequency } from './assets/js/katulaAnalytics.js';
        import { getUniverseFormes } from './assets/js/katulaUtils.js';

        const API_BASE = 'http://localhost:8000/api';

        function addResult(message, isSuccess = true) {
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            document.getElementById('testResults').appendChild(div);
        }

        window.testModules = function() {
            document.getElementById('testResults').innerHTML = '';
            
            try {
                // Test des constantes
                if (FORME_ICONS.carre === '■') {
                    addResult('✅ Module katulaConstants chargé');
                } else {
                    addResult('❌ Erreur module katulaConstants', false);
                }

                // Test des utilitaires
                const testFormes = getUniverseFormes({ formes: { formes: ['test'] } });
                if (testFormes[0] === 'test') {
                    addResult('✅ Module katulaUtils chargé');
                } else {
                    addResult('❌ Erreur module katulaUtils', false);
                }

                // Test analytics
                const freq = getChipFrequency(12);
                if (typeof freq === 'number') {
                    addResult('✅ Module katulaAnalytics chargé');
                } else {
                    addResult('❌ Erreur module katulaAnalytics', false);
                }

                addResult('🎉 Tous les modules sont fonctionnels!');

            } catch (error) {
                addResult('❌ Erreur lors du test: ' + error.message, false);
            }
        };

        window.testAPI = async function() {
            try {
                addResult('🔄 Test de connexion API...');
                
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    addResult('✅ API accessible');
                    
                    // Test endpoint formes
                    const formesResponse = await fetch(`${API_BASE}/formes/real/mundo`);
                    if (formesResponse.ok) {
                        addResult('✅ Endpoint formes réelles accessible');
                    } else {
                        addResult('⚠️ Endpoint formes non accessible (404)', false);
                    }
                } else {
                    addResult('❌ API non accessible', false);
                }
            } catch (error) {
                addResult('❌ Erreur API: ' + error.message, false);
            }
        };

        // Test automatique au chargement
        setTimeout(() => {
            addResult('🚀 Application modulaire initialisée');
        }, 100);
    </script>
</body>
</html>
