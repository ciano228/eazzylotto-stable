<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EazzyCalculator - Table de Katula Complète</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            color: #2c3e50;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            min-width: 150px;
        }

        button {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }

        .katula-grid {
            display: grid;
            grid-template-columns: 80px repeat(6, 1fr);
            grid-template-rows: 40px repeat(8, 1fr);
            gap: 4px;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
            position: relative;
            align-items: stretch;
            justify-items: stretch;
        }

        .grid-header {
            background: #34495e;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
        }

        .ligne-label {
            background: #2c3e50;
            color: white;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .chip-cell {
            background: white;
            border: 2px solid #34495e;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .chip-cell:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .chip-header {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 5px;
            font-weight: bold;
            font-size: 0.8em;
            border-radius: 5px 5px 0 0;
        }

        .chip-drawers {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chip-drawer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #bdc3c7;
            padding: 8px 4px;
            font-size: 0.8em;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.9);
        }

        .chip-drawer:last-child {
            border-bottom: none;
        }

        .chip-drawer:hover {
            background: rgba(52, 152, 219, 0.2);
            transform: scale(1.1);
            cursor: pointer;
        }

        .chip-drawer.empty {
            background: #f5f5f5;
            color: #999;
            font-style: italic;
        }

        .forme-icon {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 1.4em;
            font-weight: bold;
            opacity: 1;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 1.2em;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .success {
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .katula-grid {
                grid-template-columns: auto repeat(3, 1fr);
                gap: 2px;
                padding: 10px;
            }
            
            .chip-cell {
                min-height: 80px;
            }
            
            .chip-drawer {
                font-size: 0.7em;
                padding: 4px 2px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Table de Katula Complète</h1>
            <p>Matrice 8x6 avec chips, formes, dénominations et tiroirs détaillés</p>
        </div>

        <div class="controls">
            <select id="universeSelect">
                <option value="">Sélectionner un univers</option>
                <option value="mundo">🌍 Mundo</option>
                <option value="fruity">🍎 Fruity</option>
                <option value="trigga">⚡ Trigga</option>
                <option value="roaster">☕ Roaster</option>
                <option value="sunshine">☀️ Sunshine</option>
            </select>
            <button onclick="loadUniverse()" id="loadBtn">🔄 Charger Univers</button>
        </div>

        <div class="main-content">
            <div id="katulaContainer"></div>
            <div id="loadingIndicator" class="loading" style="display: none;">
                🔄 Chargement des données depuis la base de données...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002/api';
        let currentUniverse = null;
        let universeData = null;

        // Icônes pour les formes avec couleurs
        const FORME_ICONS = {
            'carre': '■',        // Bleu
            'triangle': '▲',     // Vert
            'cercle': '●',       // Jaune
            'rectangle': '▬',    // Rouge
            'carre-triangle': '■▲',
            'carre-cercle': '■●',
            'carre-rectangle': '■▬',
            'triangle-carre': '▲■',
            'triangle-cercle': '▲●',
            'triangle-rectangle': '▲▬',
            'cercle-carre': '●■',
            'cercle-triangle': '●▲',
            'cercle-rectangle': '●▬',
            'rectangle-carre': '▬■',
            'rectangle-triangle': '▬▲',
            'rectangle-cercle': '▬●'
        };

        // Couleurs des formes de base
        const FORME_COLORS = {
            'carre': '#3498db',      // Bleu
            'triangle': '#27ae60',   // Vert
            'cercle': '#f1c40f',     // Jaune
            'rectangle': '#e74c3c'   // Rouge
        };

        async function loadUniverse() {
            const universeSelect = document.getElementById('universeSelect');
            const selectedUniverse = universeSelect.value;
            
            if (!selectedUniverse) {
                alert('Veuillez sélectionner un univers');
                return;
            }

            const loadBtn = document.getElementById('loadBtn');
            loadBtn.disabled = true;
            loadBtn.textContent = '🔄 Chargement...';
            
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('katulaContainer').innerHTML = '';
            
            try {
                currentUniverse = selectedUniverse;
                
                // Charger les données de l'univers
                await loadUniverseData(selectedUniverse);
                
                // Afficher l'interface
                displayKatulaTable();
                
                showSuccess(`Univers ${selectedUniverse} chargé avec succès!`);
                
            } catch (error) {
                showError('Erreur lors du chargement: ' + error.message);
                console.error('Erreur:', error);
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '🔄 Charger Univers';
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        async function loadUniverseData(universe) {
            try {
                console.log(`Chargement de ${universe}...`);
                
                // Simuler les données de table (pas d'endpoint table)
                const tableData = { status: 'simulated', chips: 48 };
                
                // Charger les formes spécifiques à cet univers
                const formesResponse = await fetch(`${API_BASE}/formes/real/${universe}`);
                let formesData = { formes: ['carre', 'triangle', 'cercle', 'rectangle'] };
                if (formesResponse.ok) {
                    formesData = await formesResponse.json();
                }
                
                // Charger les données détaillées pour chaque chip (1-48)
                const chipDetails = {};
                for (let chipNum = 1; chipNum <= 48; chipNum++) {
                    try {
                        const chipResponse = await fetch(`${API_BASE}/formes/real/${universe}/chip/${chipNum}`);
                        if (chipResponse.ok) {
                            const chipData = await chipResponse.json();
                            chipDetails[chipNum] = chipData;
                        }
                    } catch (e) {
                        console.warn(`Chip ${chipNum} non disponible:`, e);
                        chipDetails[chipNum] = { formes_data: {} };
                    }
                }
                
                universeData = {
                    table: tableData,
                    formes: formesData,
                    chipDetails: chipDetails,
                    universe: universe
                };
                
                console.log(`${universe} chargé avec succès:`, universeData);
                
            } catch (error) {
                console.error(`Erreur chargement ${universe}:`, error);
                throw error;
            }
        }

        function displayKatulaTable() {
            if (!universeData) {
                document.getElementById('katulaContainer').innerHTML = '<div class="error">Données non disponibles</div>';
                return;
            }

            let html = '<div class="katula-grid">';
            
            // En-têtes
            html += '<div class="grid-header">Lignes</div>';
            for (let col = 1; col <= 6; col++) {
                html += `<div class="grid-header">C${col}</div>`;
            }
            
            // Générer les 8 lignes × 6 colonnes = 48 chips
            for (let ligne = 1; ligne <= 8; ligne++) {
                html += `<div class="ligne-label">L${ligne}</div>`;
                
                for (let col = 1; col <= 6; col++) {
                    const chipNumber = ((ligne - 1) * 6) + col;
                    html += createChipHTML(chipNumber, ligne, col);
                }
            }
            
            html += '</div>';
            document.getElementById('katulaContainer').innerHTML = html;
        }

        function createChipHTML(chipNumber, ligne, col) {
            const chipData = universeData.chipDetails[chipNumber];
            const formesData = chipData ? chipData.formes_data : {};
            const formes = getUniverseFormes();
            
            let html = `
                <div class="chip-cell" data-chip="${chipNumber}" onclick="showChipDetails(${chipNumber})" title="chip${chipNumber}">
                    <div class="chip-header">chip${chipNumber}</div>
                    <div class="chip-drawers">
            `;
            
            // Créer les tiroirs selon les formes disponibles
            formes.forEach(forme => {
                const formeItems = formesData[forme] || [];
                const isEmpty = formeItems.length === 0;
                
                // Gérer les dénominations multiples
                let displayText = '---';
                let allDenominations = [];
                
                if (formeItems.length > 0) {
                    // Extraire toutes les dénominations uniques
                    allDenominations = [...new Set(formeItems.map(item => item.denomination))];
                    
                    if (allDenominations.length === 1) {
                        displayText = allDenominations[0];
                    } else if (allDenominations.length > 1) {
                        displayText = allDenominations.join('/');
                    }
                }
                
                const searchDenominations = allDenominations.length > 0 ? allDenominations.join('/') : displayText;
                
                html += `
                    <div class="chip-drawer ${isEmpty ? 'empty' : ''}" 
                         data-forme="${forme}" data-chip="${chipNumber}"
                         data-denomination="${displayText}"
                         onclick="showDenominationDetails('${searchDenominations}', '${currentUniverse}', event)">
                        ${generateFormeIcon(forme)}
                        <span class="drawer-text">${displayText}</span>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            return html;
        }

        function generateFormeIcon(forme) {
            if (forme.includes('-')) {
                // Forme composée - créer deux spans colorés
                const [forme1, forme2] = forme.split('-');
                const icon1 = FORME_ICONS[forme1] || '?';
                const icon2 = FORME_ICONS[forme2] || '?';
                const color1 = FORME_COLORS[forme1] || '#666';
                const color2 = FORME_COLORS[forme2] || '#666';
                
                return `
                    <span class="forme-icon-composite">
                        <span class="forme-part" style="color: ${color1}">${icon1}</span><span class="forme-part" style="color: ${color2}">${icon2}</span>
                    </span>
                `;
            } else {
                // Forme simple
                const icon = FORME_ICONS[forme] || '?';
                const color = FORME_COLORS[forme] || '#666';
                
                return `<span class="forme-icon" style="color: ${color}">${icon}</span>`;
            }
        }

        function getUniverseFormes() {
            if (universeData && universeData.formes && universeData.formes.formes) {
                return universeData.formes.formes;
            }
            return ['carre', 'triangle', 'cercle', 'rectangle'];
        }

        function showChipDetails(chipNumber) {
            const chipData = universeData.chipDetails[chipNumber];
            if (!chipData || !chipData.formes_data || Object.keys(chipData.formes_data).length === 0) {
                alert(`chip${chipNumber}: Aucune donnée disponible`);
                return;
            }
            
            const formesData = chipData.formes_data;
            let details = `🎯 chip${chipNumber} - ${currentUniverse.toUpperCase()}\n\n`;
            
            // Organiser par forme
            Object.entries(formesData).forEach(([forme, items]) => {
                const icon = FORME_ICONS[forme] || '?';
                details += `${icon} ${forme.toUpperCase()}:\n`;
                items.slice(0, 3).forEach(item => {
                    details += `  • ${item.denomination}\n`;
                });
                if (items.length > 3) {
                    details += `  ... et ${items.length - 3} autres\n`;
                }
                details += '\n';
            });
            
            const totalItems = Object.values(formesData).reduce((sum, items) => sum + items.length, 0);
            details += `📊 Total: ${totalItems} éléments`;
            alert(details);
        }

        async function showDenominationDetails(denomination, universe, event) {
            event.stopPropagation();
            
            if (denomination === '---') return;
            
            try {
                const denominations = denomination.split('/').map(d => d.trim());
                let allCombinations = [];
                
                for (const singleDenomination of denominations) {
                    const url = `${API_BASE}/denomination/${universe}/${encodeURIComponent(singleDenomination)}`;
                    const response = await fetch(url);
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.details && data.details.length > 0) {
                            allCombinations.push(...data.details);
                        }
                    }
                }
                
                if (allCombinations.length === 0) {
                    alert(`Aucune combinaison trouvée pour "${denomination}" dans ${universe}`);
                    return;
                }
                
                // Afficher les détails
                let details = `🎯 ${denomination.toUpperCase()} - ${universe.toUpperCase()}\n\n`;
                details += `📊 Total: ${allCombinations.length} combinaisons\n\n`;
                
                allCombinations.slice(0, 10).forEach((combo, i) => {
                    details += `${i+1}. ${combo.num1}-${combo.num2} (${combo.alpha_ranking || 'N/A'})\n`;
                });
                
                if (allCombinations.length > 10) {
                    details += `\n... et ${allCombinations.length - 10} autres`;
                }
                
                alert(details);
                
            } catch (error) {
                showError('Erreur: ' + error.message);
            }
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            document.querySelector('.container').appendChild(successDiv);
            setTimeout(() => successDiv.remove(), 3000);
        }
    </script>
</body>
</html>
