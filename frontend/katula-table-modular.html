<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EazzyCalculator - Table de Katula Modulaire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            color: #2c3e50;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            min-width: 150px;
        }

        button {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }

        .katula-grid {
            display: grid;
            grid-template-columns: 80px repeat(6, 1fr);
            grid-template-rows: 40px repeat(8, 1fr);
            gap: 4px;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 10px;
            position: relative;
            align-items: stretch;
            justify-items: stretch;
        }

        .grid-header {
            background: #34495e;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
        }

        .ligne-label {
            background: #2c3e50;
            color: white;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .chip-cell {
            background: white;
            border: 2px solid #34495e;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .chip-cell:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .chip-header {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 5px;
            font-weight: bold;
            font-size: 0.8em;
            border-radius: 5px 5px 0 0;
        }

        .chip-drawers {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chip-drawer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #bdc3c7;
            padding: 8px 4px;
            font-size: 0.8em;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.9);
        }

        .chip-drawer:last-child {
            border-bottom: none;
        }

        .chip-drawer:hover {
            background: rgba(52, 152, 219, 0.2);
            transform: scale(1.1);
            cursor: pointer;
        }

        .chip-drawer.empty {
            background: #f5f5f5;
            color: #999;
            font-style: italic;
        }

        .forme-icon {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 1.4em;
            font-weight: bold;
            opacity: 1;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .forme-icon-composite {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 1.2em;
            font-weight: bold;
            opacity: 1;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            z-index: 5;
        }

        .chip-meta {
            background: #f8f9fa;
            padding: 4px;
            font-size: 0.7em;
            text-align: center;
            border-radius: 0 0 5px 5px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 1.2em;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .success {
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .katula-grid {
                grid-template-columns: auto repeat(3, 1fr);
                gap: 2px;
                padding: 10px;
            }
            
            .chip-cell {
                min-height: 80px;
            }
            
            .chip-drawer {
                font-size: 0.7em;
                padding: 4px 2px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Table de Katula Modulaire</h1>
            <p>Architecture modulaire avec données réelles de la base</p>
        </div>

        <div class="controls">
            <select id="universeSelect">
                <option value="">Sélectionner un univers</option>
                <option value="mundo">🌍 Mundo</option>
                <option value="fruity">🍎 Fruity</option>
                <option value="trigga">⚡ Trigga</option>
                <option value="roaster">☕ Roaster</option>
                <option value="sunshine">☀️ Sunshine</option>
            </select>
            <button onclick="loadUniverse()" id="loadBtn">🔄 Charger Univers</button>
        </div>

        <div class="main-content">
            <div id="katulaContainer"></div>
            <div id="loadingIndicator" class="loading" style="display: none;">
                🔄 Chargement des données depuis la base de données...
            </div>
        </div>
    </div>

    <script type="module">
        // Import des modules
        import { loadUniverseData } from './assets/js/katulaLoader.js';
        import { renderKatulaGrid } from './assets/js/katulaRenderer.js';
        import { showChipDetails, showDenominationDetails, showError, showSuccess } from './assets/js/katulaUI.js';

        // Configuration
        const API_BASE = 'http://localhost:8002/api';
        let currentUniverse = null;
        let universeData = null;

        // Fonctions globales pour les événements onclick
        window.showChipDetails = (chipNumber) => showChipDetails(chipNumber, universeData);
        window.showDenominationDetails = (denomination, universe, event) => 
            showDenominationDetails(denomination, universe, event, API_BASE);

        // Fonction principale de chargement
        window.loadUniverse = async function() {
            const universeSelect = document.getElementById('universeSelect');
            const selectedUniverse = universeSelect.value;
            
            if (!selectedUniverse) {
                alert('Veuillez sélectionner un univers');
                return;
            }

            const loadBtn = document.getElementById('loadBtn');
            loadBtn.disabled = true;
            loadBtn.textContent = '🔄 Chargement...';
            
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('katulaContainer').innerHTML = '';
            
            try {
                currentUniverse = selectedUniverse;
                
                // Charger les données via le module
                universeData = await loadUniverseData(selectedUniverse, API_BASE);
                
                // Afficher l'interface via le module
                renderKatulaGrid(universeData, 'katulaContainer');
                
                showSuccess(`Univers ${selectedUniverse} chargé avec succès!`);
                
            } catch (error) {
                showError('Erreur lors du chargement: ' + error.message);
                console.error('Erreur:', error);
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '🔄 Charger Univers';
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        };

        // Initialisation
        console.log('Application Katula Modulaire initialisée');
    </script>
</body>
</html>
