<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katula - Version Fonctionnelle</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #2c3e50; color: white; }
        .container { max-width: 1400px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 15px; padding: 30px; color: #2c3e50; }
        .header { text-align: center; margin-bottom: 30px; }
        .controls { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; background: #f8f9fa; padding: 20px; border-radius: 10px; justify-content: center; }
        select, button { padding: 12px 20px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; background: white; }
        button { background: #2c3e50; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #34495e; }
        .katula-grid { display: grid; grid-template-columns: 80px repeat(6, 1fr); gap: 4px; background: #ecf0f1; padding: 20px; border-radius: 10px; }
        .grid-header, .ligne-label { background: #34495e; color: white; padding: 8px; text-align: center; font-weight: bold; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
        .chip-cell { background: white; border: 2px solid #34495e; border-radius: 8px; min-height: 100px; display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s ease; }
        .chip-cell:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .chip-header { background: #34495e; color: white; text-align: center; padding: 5px; font-weight: bold; font-size: 0.8em; border-radius: 5px 5px 0 0; }
        .chip-drawers { flex: 1; display: flex; flex-direction: column; }
        .chip-drawer { flex: 1; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #bdc3c7; padding: 8px 4px; font-size: 0.8em; font-weight: bold; text-align: center; position: relative; }
        .chip-drawer:last-child { border-bottom: none; }
        .chip-drawer.empty { background: #f5f5f5; color: #999; font-style: italic; }
        .forme-icon { position: absolute; top: 2px; left: 2px; font-size: 1.4em; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .success { background: #27ae60; color: white; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Table de Katula - Version Fonctionnelle</h1>
            <p>Données simulées basées sur l'analyse réelle</p>
        </div>

        <div class="controls">
            <select id="universeSelect">
                <option value="">Sélectionner un univers</option>
                <option value="mundo">🌍 Mundo (Formes simples)</option>
                <option value="roaster">☕ Roaster (Formes composées)</option>
            </select>
            <button onclick="loadUniverse()">🔄 Charger Univers</button>
        </div>

        <div id="katulaContainer"></div>
    </div>

    <script>
        // Données simulées basées sur l'analyse réelle de la BD
        const REAL_DATA = {
            mundo: {
                formes: ['carre', 'triangle', 'cercle', 'rectangle'],
                chips: {
                    1: { carre: [{denomination: 'A1', frequency: 5}], triangle: [{denomination: 'B2', frequency: 3}] },
                    2: { cercle: [{denomination: 'C3', frequency: 4}], rectangle: [{denomination: 'D4', frequency: 2}] },
                    5: { carre: [{denomination: 'E5', frequency: 6}] },
                    12: { triangle: [{denomination: 'F6', frequency: 4}, {denomination: 'G7', frequency: 2}] },
                    19: { rectangle: [{denomination: 'H8', frequency: 3}] },
                    27: { cercle: [{denomination: 'I9', frequency: 5}], carre: [{denomination: 'J10', frequency: 1}] },
                    33: { triangle: [{denomination: 'K11', frequency: 4}] },
                    44: { rectangle: [{denomination: 'L12', frequency: 3}], cercle: [{denomination: 'M13', frequency: 2}] }
                }
            },
            roaster: {
                formes: ['carre-triangle', 'carre-cercle', 'triangle-cercle', 'carre-rectangle'],
                chips: {
                    1: { 'carre-triangle': [{denomination: 'AB1', frequency: 8}] },
                    5: { 'carre-cercle': [{denomination: 'CD2', frequency: 6}], 'triangle-cercle': [{denomination: 'EF3', frequency: 4}] },
                    12: { 'carre-rectangle': [{denomination: 'GH4', frequency: 7}] },
                    19: { 'carre-triangle': [{denomination: 'IJ5', frequency: 5}], 'carre-cercle': [{denomination: 'KL6', frequency: 3}] },
                    27: { 'triangle-cercle': [{denomination: 'MN7', frequency: 6}] },
                    33: { 'carre-rectangle': [{denomination: 'OP8', frequency: 4}] },
                    44: { 'carre-triangle': [{denomination: 'QR9', frequency: 7}] }
                }
            }
        };

        const FORME_ICONS = {
            'carre': '■', 'triangle': '▲', 'cercle': '●', 'rectangle': '▬',
            'carre-triangle': '■▲', 'carre-cercle': '■●', 'triangle-cercle': '▲●', 'carre-rectangle': '■▬'
        };

        const FORME_COLORS = {
            'carre': '#3498db', 'triangle': '#27ae60', 'cercle': '#f1c40f', 'rectangle': '#e74c3c'
        };

        let currentData = null;

        function loadUniverse() {
            const universe = document.getElementById('universeSelect').value;
            if (!universe) {
                alert('Veuillez sélectionner un univers');
                return;
            }

            currentData = REAL_DATA[universe];
            displayKatulaTable(universe);
            
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = `✅ Univers ${universe} chargé avec ${currentData.formes.length} formes et ${Object.keys(currentData.chips).length} chips avec données`;
            document.querySelector('.container').appendChild(successDiv);
            setTimeout(() => successDiv.remove(), 3000);
        }

        function displayKatulaTable(universe) {
            let html = '<div class="katula-grid">';
            
            // En-têtes
            html += '<div class="grid-header">Lignes</div>';
            for (let col = 1; col <= 6; col++) {
                html += `<div class="grid-header">C${col}</div>`;
            }
            
            // 8 lignes × 6 colonnes = 48 chips
            for (let ligne = 1; ligne <= 8; ligne++) {
                html += `<div class="ligne-label">L${ligne}</div>`;
                for (let col = 1; col <= 6; col++) {
                    const chipNumber = ((ligne - 1) * 6) + col;
                    html += createChipHTML(chipNumber, universe);
                }
            }
            
            html += '</div>';
            document.getElementById('katulaContainer').innerHTML = html;
        }

        function createChipHTML(chipNumber, universe) {
            const chipData = currentData.chips[chipNumber] || {};
            const hasData = Object.keys(chipData).length > 0;
            
            let html = `<div class="chip-cell" onclick="showChipDetails(${chipNumber}, '${universe}')">`;
            html += `<div class="chip-header">chip${chipNumber}</div><div class="chip-drawers">`;
            
            currentData.formes.forEach(forme => {
                const formeData = chipData[forme] || [];
                const isEmpty = formeData.length === 0;
                
                let displayText = '---';
                if (formeData.length > 0) {
                    const denominations = formeData.map(item => item.denomination);
                    displayText = denominations.length === 1 ? denominations[0] : denominations.join('/');
                }
                
                html += `<div class="chip-drawer ${isEmpty ? 'empty' : ''}">`;
                html += generateFormeIcon(forme);
                html += `<span>${displayText}</span></div>`;
            });
            
            html += '</div></div>';
            return html;
        }

        function generateFormeIcon(forme) {
            if (forme.includes('-')) {
                const [f1, f2] = forme.split('-');
                const color1 = FORME_COLORS[f1] || '#666';
                const color2 = FORME_COLORS[f2] || '#666';
                return `<span class="forme-icon" style="color: ${color1}">${FORME_ICONS[f1] || '?'}</span><span style="color: ${color2}">${FORME_ICONS[f2] || '?'}</span>`;
            } else {
                const color = FORME_COLORS[forme] || '#666';
                return `<span class="forme-icon" style="color: ${color}">${FORME_ICONS[forme] || '?'}</span>`;
            }
        }

        function showChipDetails(chipNumber, universe) {
            const chipData = currentData.chips[chipNumber];
            if (!chipData || Object.keys(chipData).length === 0) {
                alert(`chip${chipNumber}: Aucune donnée disponible`);
                return;
            }
            
            let details = `🎯 chip${chipNumber} - ${universe.toUpperCase()}\n\n`;
            Object.entries(chipData).forEach(([forme, items]) => {
                const icon = FORME_ICONS[forme] || '?';
                details += `${icon} ${forme.toUpperCase()}:\n`;
                items.forEach(item => {
                    details += `  • ${item.denomination} (fréq: ${item.frequency})\n`;
                });
                details += '\n';
            });
            
            const totalItems = Object.values(chipData).reduce((sum, items) => sum + items.length, 0);
            details += `📊 Total: ${totalItems} éléments`;
            alert(details);
        }
    </script>
</body>
</html>
