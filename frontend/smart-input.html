            const sessionId = document.getElementById('sessionSelect').value;
            if (!sessionId) {
                showMessage('Veuillez sélectionner une session à supprimer', 'error');
                return;
            }

            const sessionName = document.getElementById('sessionSelect').selectedOptions[0].textContent;

            if (!confirm(`⚠️ ATTENTION: Supprimer définitivement la session:\n\n"${sessionName}"\n\nTous les tirages de cette session seront perdus.\n\nContinuer?`)) return;

            console.log('🗑️ Tentative de suppression session ID:', sessionId);
            console.log('🗑️ Nom de session:', sessionName);

            try {
                // Test 1: Essayer DELETE classique
                console.log('🔄 Test 1: DELETE /sessions/' + sessionId);
                let response = await fetch(`${API_BASE}/sessions/${sessionId}`, {
                    method: 'DELETE'
                });

                console.log('📥 Réponse DELETE:', response.status, response.statusText);

                if (response.ok) {
                    console.log('✅ DELETE réussi');
                    showMessage('✅ Session supprimée avec succès (DELETE)', 'success');
                    await resetInterface();
                    return;
                }

                // Test 2: Essayer POST /sessions/{id}/delete
                console.log('🔄 Test 2: POST /sessions/' + sessionId + '/delete');
                response = await fetch(`${API_BASE}/sessions/${sessionId}/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                console.log('📥 Réponse POST delete:', response.status, response.statusText);

                if (response.ok) {
                    console.log('✅ POST delete réussi');
                    showMessage('✅ Session supprimée avec succès (POST delete)', 'success');
                    await resetInterface();
                    return;
                }

                // Test 3: Marquer comme supprimée
                console.log('🔄 Test 3: Marquage comme supprimée');
                response = await fetch(`${API_BASE}/session`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: sessionId,
                        name: `[SUPPRIMÉE] ${sessionName.replace('[SUPPRIMÉE] ', '')}`,
                        is_active: false
                    })
                });

                console.log('📥 Réponse PUT:', response.status, response.statusText);

                if (response.ok) {
                    console.log('✅ Marquage réussi');
                    showMessage('✅ Session marquée comme supprimée', 'success');
                    await resetInterface();
                    return;
                }

                // Toutes les méthodes ont échoué
                const errorText = await response.text();
                console.error('❌ Toutes les méthodes ont échoué. Dernière erreur:', errorText);
                showMessage(`❌ Impossible de supprimer la session. Statut: ${response.status}. Détails: ${errorText}`, 'error');

            } catch (error) {
                console.error('❌ Erreur de connexion:', error);
                showMessage('Erreur de connexion: ' + error.message, 'error');
            }
        }

        // Fonction helper pour réinitialiser l'interface
        async function resetInterface() {
            currentSession = null;
            currentDrawData = null;
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('drawInputSection').style.display = 'none';
            document.getElementById('resultsHistorySection').style.display = 'none';
            document.getElementById('deleteSessionBtn').disabled = true;
            document.getElementById('activateBtn').disabled = true;
            await loadSessions();
        }

        // Reprendre la session actuelle après une pause
        async function resumeCurrentSession() {
            if (!currentSession) {
                showMessage('Aucune session active à reprendre', 'error');
                return;
            }

            console.log('🔄 Reprise de la session:', currentSession.name);

            try {
                // Recharger les détails de la session pour reprendre où on était
                await loadSessionDetails(currentSession.id);
                showMessage(`▶️ Session "${currentSession.name}" reprise`, 'success');
            } catch (error) {
                console.error('❌ Erreur reprise session:', error);
                showMessage('Erreur lors de la reprise: ' + error.message, 'error');
            }
        }

        // Éditer un tirage
        async function editDraw(drawNumber) {
            if (!currentSession) {
                showMessage('Aucune session active', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/sessions/${currentSession.id}/draws`);
                const draws = await response.json();
                const draw = draws.find(d => d.draw_number === drawNumber);

                if (!draw) {
                    showMessage('Tirage non trouvé', 'error');
                    return;
                }

                const newDate = prompt('Date du tirage (AAAA-MM-JJ) :', draw.draw_date || '');
                if (newDate === null) return;

                const newName = prompt('Nom du loto :', draw.lottery_name || '');
                if (newName === null) return;

                const currentNumbers = (draw.winning_numbers || []).join(' ');
                const newNumbers = prompt('Numéros gagnants (séparés par un espace, vide pour no-draw) :', currentNumbers);
                if (newNumbers === null) return;

                const numbersArr = newNumbers.trim() ? newNumbers.trim().split(/\s+/).map(x => parseInt(x)).filter(x => !isNaN(x)) : [];

                const updateData = {
                    numbers: numbersArr,
                    draw_date: newDate,
                    lottery_name: newName,
                    is_no_draw: numbersArr.length === 0
                };

                const updateResponse = await fetch(`${API_BASE}/sessions/${currentSession.id}/draws/${drawNumber}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (updateResponse.ok) {
                    showMessage('✅ Tirage modifié avec succès', 'success');
                    await loadSessionHistory(currentSession.id);
                } else {
                    const error = await updateResponse.json();
                    showMessage('Erreur: ' + (error.detail || 'Erreur inconnue'), 'error');
                }

            } catch (error) {
                console.error('❌ Erreur modification:', error);
                showMessage('Erreur de connexion: ' + error.message, 'error');
            }
        }

        // Supprimer un tirage
        async function deleteDraw(drawNumber) {
            if (!currentSession) {
                showMessage('Aucune session active', 'error');
                return;
            }

            if (!confirm(`Êtes-vous sûr de vouloir supprimer le tirage #${drawNumber} ?\n\nTous les tirages suivants seront renumérotés.\n\nCette action est irréversible.`)) return;

            try {
                // Charger tous les tirages de la session
                const response = await fetch(`${API_BASE}/sessions/${currentSession.id}/draws`);
                const allDraws = await response.json();

                // Filtrer pour supprimer le tirage spécifié
                const remainingDraws = allDraws.filter(d => d.draw_number !== drawNumber);

                // Filtrer seulement les tirages avec des données valides
                const validDraws = remainingDraws.filter(draw =>
                    draw.lottery_name &&
                    draw.lottery_name.trim() !== '' &&
                    draw.lottery_name !== 'null' &&
                    (draw.winning_numbers && draw.winning_numbers.length > 0) || draw.is_no_draw
                );

                // Renuméroter les tirages valides restants
                const renumberedDraws = validDraws
                    .sort((a, b) => new Date(a.draw_date) - new Date(b.draw_date))
                    .map((draw, index) => ({
                        ...draw,
                        draw_number: index + 1
                    }));

                console.log(`Suppression: ${allDraws.length} -> ${validDraws.length} tirages valides`);

                // Vider et recréer avec les tirages valides renumérotés
                for (let i = 1; i <= allDraws.length; i++) {
                    try {
                        await fetch(`${API_BASE}/sessions/${currentSession.id}/draws/${i}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                numbers: [],
                                draw_date: new Date().toISOString().split('T')[0],
                                lottery_name: 'DELETED',
                                is_no_draw: false,
                                is_completed: false
                            })
                        });
                    } catch (e) {
                        // Ignorer les erreurs de nettoyage
                    }
                }

                // Recréer seulement les tirages valides
                for (const draw of renumberedDraws) {
                    await fetch(`${API_BASE}/sessions/${currentSession.id}/draws/${draw.draw_number}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            numbers: draw.winning_numbers || [],
                            draw_date: draw.draw_date,
                            lottery_name: draw.lottery_name,
                            is_no_draw: draw.is_no_draw || false
                        })
                    });
                }

                showMessage(`✅ Tirage #${drawNumber} supprimé et ${renumberedDraws.length} tirages renumérotés`, 'success');

                // Recharger l'interface
                await loadSessionHistory(currentSession.id);
                await loadSessionDetails(currentSession.id);

            } catch (error) {
                console.error('❌ Erreur suppression:', error);
                showMessage('Erreur de connexion: ' + error.message, 'error');
            }
        }

        // Fermer le modal en cliquant à l'extérieur
        window.onclick = function (event) {
            const modal = document.getElementById('createSessionModal');
            if (event.target === modal) {
                closeCreateSessionModal();
            }
        }
    </script>
</body>
