<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EazzyCalculator - Saisie Intelligente</title>
    <!-- TEMPORAIREMENT RETIRÉ POUR TEST -->
    <!-- <script src="../../assets/js/universal-header.js"></script> -->
    <style>
        /* GARDEZ VOTRE CSS EXISTANT */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
        }
        .container { 
            max-width: 1200px; margin: 0 auto; background: white; 
            border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            overflow: hidden; 
        }
        .main-content { padding: 30px; }
        .session-selector { 
            background: #f8f9fa; border-radius: 10px; padding: 25px; 
            margin-bottom: 30px; border-left: 5px solid #1890ff; 
        }
        .session-controls { 
            display: grid; grid-template-columns: 1fr auto auto; gap: 15px; 
            align-items: end; 
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        select, input, button { 
            padding: 12px; border: 2px solid #e1e5e9; border-radius: 8px; 
            font-size: 14px; transition: all 0.3s ease; 
        }
        button { 
            background: #1890ff; color: white; border: none; cursor: pointer; 
            font-weight: 600; transition: all 0.3s ease; 
        }
        button:hover { 
            background: #40a9ff; transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3); 
        }
        .create-session-btn { background: #52c41a; }
        .create-session-btn:hover { background: #73d13d; }
        .modal { 
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; 
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); 
        }
        .modal-content { 
            background-color: white; margin: 15% auto; padding: 30px; 
            border-radius: 15px; width: 90%; max-width: 600px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .close { 
            color: #aaa; float: right; font-size: 28px; font-weight: bold; 
            cursor: pointer; line-height: 1; 
        }
        .close:hover { color: #000; }
    </style>
</head>
<body>
    <!-- TEMPORAIREMENT RETIRÉ POUR TEST -->
    <!-- <div id="header-container"></div> -->
    
    <div class="container">
        <div class="main-content">
            <!-- Sélecteur de Session SIMPLIFIÉ -->
            <div class="session-selector">
                <h3 style="margin-top: 0; color: #1890ff;">📋 Gestion des Sessions - TEST</h3>
                <div class="session-controls">
                    <div class="form-group">
                        <label for="sessionSelect">Session Active:</label>
                        <select id="sessionSelect" class="form-control">
                            <option value="">Session 1</option>
                            <option value="">Session 2</option>
                        </select>
                    </div>
                    <button id="activateBtn">Activer</button>
                    <button id="newSessionBtn" class="create-session-btn">Nouvelle Session</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Création Session SIMPLIFIÉ -->
    <div id="createSessionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" id="closeModalBtn">&times;</span>
                <h2 style="margin: 0; color: #1890ff;">🆕 Nouvelle Session - TEST</h2>
            </div>
            <p>Ce modal fonctionne ! Le bouton "Nouvelle Session" marche.</p>
            <button onclick="closeModal()" style="margin-top: 20px;">Fermer</button>
        </div>
    </div>

    <script>
        // === VERSION SIMPLIFIÉE POUR DÉBOGUAGE ===
        console.log("✅ Script chargé - Début de l'initialisation");

        // Références aux éléments
        const newSessionBtn = document.getElementById('newSessionBtn');
        const createSessionModal = document.getElementById('createSessionModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const activateBtn = document.getElementById('activateBtn');

        // Vérification que les éléments existent
        console.log("Éléments trouvés:", {
            newSessionBtn: !!newSessionBtn,
            createSessionModal: !!createSessionModal,
            closeModalBtn: !!closeModalBtn,
            activateBtn: !!activateBtn
        });

        // Fonctions simples et directes
        function showCreateSessionModal() {
            console.log("🔄 showCreateSessionModal appelée");
            if (createSessionModal) {
                createSessionModal.style.display = 'block';
                console.log("✅ Modal affiché");
            } else {
                console.error("❌ Modal non trouvé");
            }
        }

        function closeModal() {
            console.log("🔄 closeModal appelée");
            if (createSessionModal) {
                createSessionModal.style.display = 'none';
                console.log("✅ Modal fermé");
            }
        }

        function activateSession() {
            console.log("🔄 activateSession appelée");
            alert("Bouton Activer cliqué !");
        }

        // Assignation directe des événements
        if (newSessionBtn) {
            newSessionBtn.addEventListener('click', showCreateSessionModal);
            console.log("✅ Événement click ajouté à newSessionBtn");
        }

        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', closeModal);
            console.log("✅ Événement click ajouté à closeModalBtn");
        }

        if (activateBtn) {
            activateBtn.addEventListener('click', activateSession);
            console.log("✅ Événement click ajouté à activateBtn");
        }

        // Fermer le modal en cliquant à l'extérieur
        window.addEventListener('click', function(event) {
            if (event.target === createSessionModal) {
                closeModal();
            }
        });

        console.log("✅ Initialisation terminée - Tous les événements sont configurés");

        // Test manuel depuis la console
        window.testModal = function() {
            console.log("🧪 Test manuel du modal");
            showCreateSessionModal();
        };

        console.log("💡 Tapez 'testModal()' dans la console pour tester le modal manuellement");
    </script>
</body>
</html>
