<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EazzyCalculator - Saisie Intelligente</title>
    <script src="../../assets/js/universal-header.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1890ff, #40a9ff);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        .main-content {
            padding: 30px;
        }
        .session-selector {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #1890ff;
        }
        .session-controls {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 15px;
            align-items: end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        select, input, button {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #40a9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .create-session-btn {
            background: #52c41a;
        }
        .create-session-btn:hover {
            background: #73d13d;
        }
        .progress-section {
            background: linear-gradient(135deg, #f0f9ff, #e6f7ff);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #91d5ff;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1890ff, #52c41a);
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        .draw-input-section {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .draw-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .draw-title {
            font-size: 1.8em;
            color: #1890ff;
            margin: 0;
            font-weight: 600;
        }
        .draw-subtitle {
            color: #666;
            margin: 5px 0 0 0;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }
        .number-input {
            position: relative;
        }
        .number-input input {
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1890ff;
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            padding: 15px 10px;
            transition: all 0.3s ease;
        }
        .number-input input:focus {
            background: white;
            border-color: #1890ff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
            transform: scale(1.05);
        }
        .number-input input.filled {
            background: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
        }
        .number-input input.error {
            background: #fff2f0;
            border-color: #ff4d4f;
            color: #ff4d4f;
        }
        .number-input label {
            position: absolute;
            top: -10px;
            left: 10px;
            background: white;
            padding: 0 5px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .save-btn {
            background: #52c41a;
            padding: 15px 30px;
            font-size: 16px;
        }
        .save-btn:hover {
            background: #73d13d;
        }
        .next-btn {
            background: #722ed1;
            padding: 15px 30px;
            font-size: 16px;
        }
        .next-btn:hover {
            background: #9254de;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow-y: auto;
            padding: 20px 0;
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .modal-form {
            display: grid;
            gap: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        .close:hover {
            color: #000;
        }
        .success-message {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        .error-message {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 1px solid #e1e5e9;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #1890ff;
            margin: 0;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin: 5px 0 0 0;
        }
        @media (max-width: 768px) {
            .session-controls {
                grid-template-columns: 1fr;
            }
            .numbers-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="container">
        <div class="main-content">
            <!-- Sélecteur de Session -->
            <div class="session-selector">
                <h3 style="margin-top: 0; color: #1890ff;">📋 Gestion des Sessions</h3>
                <div class="session-controls">
                    <div class="form-group">
                        <label for="sessionSelect">Session Active:</label>
                        <select id="sessionSelect" class="form-control" title="Sélectionner une session">
                            <option value="">Chargement des sessions...</option>
                        </select>
                    </div>
                    <button id="activateBtn" disabled>Activer</button>
                    <button id="newSessionBtn" class="create-session-btn">Nouvelle Session</button>
                </div>
            </div>

            <!-- Section Progrès -->
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="currentDrawStat">-</div>
                        <div class="stat-label">Tirage Actuel</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalDrawsStat">-</div>
                        <div class="stat-label">Total Tirages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedStat">-</div>
                        <div class="stat-label">Complétés</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="progressStat">-%</div>
                        <div class="stat-label">Progrès</div>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <p style="text-align: center; margin: 0; color: #666;" id="sessionInfo">Session: -</p>
            </div>

            <!-- Section Saisie -->
            <div class="draw-input-section" id="drawInputSection" style="display: none;">
                <div class="draw-header">
                    <h2 class="draw-title" id="drawTitle">Tirage #1</h2>
                    <p class="drawSubtitle" id="drawSubtitle">Saisissez les numéros gagnants</p>
                </div>

                <!-- Champs nom et date -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto;">
                    <div class="form-group">
                        <label for="drawName">Nom du Tirage:</label>
                        <input type="text" id="drawName" placeholder="Ex: Loto du Samedi" style="text-align: left;">
                    </div>
                    <div class="form-group">
                        <label for="drawDate">Date du Tirage:</label>
                        <input type="date" id="drawDate">
                    </div>
                </div>

                <div class="numbers-grid" id="numbersGrid">
                    <!-- Les champs seront générés dynamiquement -->
                </div>

                <div class="action-buttons">
                    <button id="saveBtn" class="save-btn" disabled>
                        💾 Sauvegarder
                    </button>
                    <button id="nextBtn" class="next-btn" disabled>
                        ➡️ Tirage Suivant
                    </button>
                    <button id="journalBtn" style="background: #fa8c16; padding: 15px 30px; font-size: 16px;">
                        📊 Journal Statistique
                    </button>
                </div>

                <div id="messageContainer"></div>
            </div>

            <!-- Historique des résultats -->
            <div id="resultsHistorySection" class="results-history-section" style="margin-top:40px;">
                <h2 id="historySessionTitle" style="text-align:center;color:#1890ff;"></h2>
                <div id="resultsHistory"></div>
            </div>
        </div>
    </div>

    <!-- Modal Création Session -->
    <div id="createSessionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" id="closeModalBtn">&times;</span>
                <h2 style="margin: 0; color: #1890ff;">🆕 Nouvelle Session de Travail</h2>
            </div>
            <form class="modal-form" id="createSessionForm">
                <div class="form-group">
                    <label for="sessionName">Nom de la Session:</label>
                    <input type="text" id="sessionName" placeholder="Ex: Session Janvier 2025" required>
                </div>
                
                <div class="form-group">
                    <label for="sessionDescription">Description (optionnelle):</label>
                    <input type="text" id="sessionDescription" placeholder="Description de la session">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="lotteryType">Type de Loto:</label>
                        <input type="text" id="lotteryType" placeholder="Ex: Loto Français" required>
                    </div>
                    <div class="form-group">
                        <label for="numbersPerDraw">Numéros par Tirage:</label>
                        <input type="number" id="numbersPerDraw" min="3" max="10" value="6" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="totalDraws">Nombre de Tirages:</label>
                        <input type="number" id="totalDraws" min="1" max="100" value="21" required>
                    </div>
                    <div class="form-group">
                        <label for="numberRange">Plage de Numéros:</label>
                        <select id="numberRange">
                            <option value="1-49">1 à 49</option>
                            <option value="1-90" selected>1 à 90</option>
                            <option value="1-99">1 à 99</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="startDate">Date de Début de la Session:</label>
                    <input type="date" id="startDate" required>
                </div>
                
                <!-- Planning des Lotos -->
                <div class="form-group">
                    <label>Planning Hebdomadaire des Lotos:</label>
                    <div id="lotteryScheduleContainer" style="border: 1px solid #e1e5e9; border-radius: 8px; padding: 15px; background: #f8f9fa;">
                        <div style="display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px;">
                            <span style="font-weight: bold; width: 80px;">Jour</span>
                            <span style="font-weight: bold;">Nom de la Loto</span>
                            <span style="font-weight: bold; width: 80px;">Action</span>
                        </div>
                        <div id="scheduleItems">
                            <!-- Les éléments du planning seront ajoutés ici -->
                        </div>
                        <div style="margin-top: 15px;">
                            <select id="daySelect" style="width: 120px; margin-right: 10px;">
                                <option value="0">Lundi</option>
                                <option value="1">Mardi</option>
                                <option value="2">Mercredi</option>
                                <option value="3">Jeudi</option>
                                <option value="4">Vendredi</option>
                                <option value="5">Samedi</option>
                                <option value="6">Dimanche</option>
                            </select>
                            <input type="text" id="lotteryNameInput" placeholder="Nom de la loto" style="flex: 1; margin-right: 10px;">
                            <button type="button" id="addScheduleBtn" style="width: auto; padding: 8px 15px;">
                                ➕ Ajouter
                            </button>
                        </div>
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 25px;">
                    <button type="submit" style="padding: 15px 30px; font-size: 16px;">
                        ✨ Créer la Session Cyclique
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const API_BASE = 'http://localhost:8881/api/unified';
        
        // ===== VARIABLES GLOBALES =====
        let currentSession = null;
        let currentDrawData = null;
        let lotterySchedule = [];

        // ===== INITIALISATION PRINCIPALE =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Démarrage de Smart Input...');
            
            // Initialiser après que le header soit chargé
            setTimeout(initializeApplication, 100);
        });

        function initializeApplication() {
            console.log('🔄 Initialisation de l\'application...');
            
            // Initialiser le planning
            lotterySchedule = [];
            updateLotteryScheduleDisplay();
            
            // Configurer tous les écouteurs d'événements
            setupEventListeners();
            
            // Initialiser le formulaire
            initCreateSessionForm();
            
            // Charger les données
            loadSessions();
            loadActiveSession();
            
            console.log('✅ Application initialisée avec succès');
        }

        // ===== CONFIGURATION DES ÉVÉNEMENTS =====
        function setupEventListeners() {
            console.log('🔄 Configuration des écouteurs d\'événements...');
            
            // Boutons principaux
            const newSessionBtn = document.getElementById('newSessionBtn');
            const activateBtn = document.getElementById('activateBtn');
            const saveBtn = document.getElementById('saveBtn');
            const nextBtn = document.getElementById('nextBtn');
            const journalBtn = document.getElementById('journalBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const addScheduleBtn = document.getElementById('addScheduleBtn');
            
            // Vérification que tous les boutons existent
            if (!newSessionBtn) console.error('❌ newSessionBtn non trouvé');
            if (!activateBtn) console.error('❌ activateBtn non trouvé');
            if (!saveBtn) console.error('❌ saveBtn non trouvé');
            if (!nextBtn) console.error('❌ nextBtn non trouvé');
            if (!journalBtn) console.error('❌ journalBtn non trouvé');
            if (!closeModalBtn) console.error('❌ closeModalBtn non trouvé');
            if (!addScheduleBtn) console.error('❌ addScheduleBtn non trouvé');
            
            // Assignation des événements
            if (newSessionBtn) newSessionBtn.addEventListener('click', showCreateSessionModal);
            if (activateBtn) activateBtn.addEventListener('click', activateSession);
            if (saveBtn) saveBtn.addEventListener('click', saveCurrentDraw);
            if (nextBtn) nextBtn.addEventListener('click', nextDraw);
            if (journalBtn) journalBtn.addEventListener('click', openStatisticalJournal);
            if (closeModalBtn) closeModalBtn.addEventListener('click', closeCreateSessionModal);
            if (addScheduleBtn) addScheduleBtn.addEventListener('click', addLotteryToSchedule);
            
            // Formulaire de création de session
            const createSessionForm = document.getElementById('createSessionForm');
            if (createSessionForm) {
                createSessionForm.addEventListener('submit', handleCreateSessionSubmit);
            }
            
            // Entrée pour le planning
            const lotteryNameInput = document.getElementById('lotteryNameInput');
            if (lotteryNameInput) {
                lotteryNameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addLotteryToSchedule();
                    }
                });
            }
            
            // Fermer le modal en cliquant à l'extérieur
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('createSessionModal');
                if (event.target === modal) {
                    closeCreateSessionModal();
                }
            });
            
            console.log('✅ Écouteurs d\'événements configurés');
        }

        // ===== FONCTIONS DU MODAL =====
        function showCreateSessionModal() {
            console.log('🔄 Ouverture du modal de création de session');
            const modal = document.getElementById('createSessionModal');
            if (modal) {
                modal.style.display = 'block';
                // Réinitialiser le planning
                lotterySchedule = [];
                updateLotteryScheduleDisplay();
                console.log('✅ Modal affiché');
            } else {
                console.error('❌ Modal non trouvé');
            }
        }

        function closeCreateSessionModal() {
            console.log('🔄 Fermeture du modal');
            const modal = document.getElementById('createSessionModal');
            if (modal) {
                modal.style.display = 'none';
                const form = document.getElementById('createSessionForm');
                if (form) form.reset();
                console.log('✅ Modal fermé');
            }
        }

        // ===== FONCTIONS DU PLANNING =====
        function addLotteryToSchedule() {
            try {
                const daySelect = document.getElementById('daySelect');
                const lotteryNameInput = document.getElementById('lotteryNameInput');
                
                if (!daySelect || !lotteryNameInput) {
                    console.error('Éléments du formulaire non trouvés');
                    return;
                }

                const day = parseInt(daySelect.value);
                const name = lotteryNameInput.value.trim();
                
                if (isNaN(day) || !name) {
                    showMessage('Veuillez sélectionner un jour et saisir un nom de tirage', 'error');
                    return;
                }

                // Vérifier si ce jour a déjà un tirage
                const dayExists = lotterySchedule.some(item => item.day === day);
                if (dayExists) {
                    showMessage('Un tirage existe déjà pour ce jour', 'error');
                    return;
                }

                // Ajouter au planning avec un ID unique
                lotterySchedule.push({ 
                    day: day, 
                    name: name,
                    id: 'tirage-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
                });
                
                // Mettre à jour l'affichage
                updateLotteryScheduleDisplay();
                
                // Réinitialiser le champ de saisie
                lotteryNameInput.value = '';
                
                showMessage('Tirage ajouté au planning', 'success');
                
            } catch (error) {
                console.error('Erreur lors de l\'ajout du tirage:', error);
                showMessage('Erreur lors de l\'ajout du tirage: ' + error.message, 'error');
            }
        }

        function updateLotteryScheduleDisplay() {
            const scheduleContainer = document.getElementById('scheduleItems');
            if (!scheduleContainer) {
                console.error('Conteneur du planning non trouvé');
                return;
            }
            
            scheduleContainer.innerHTML = '';
            
            if (!lotterySchedule || lotterySchedule.length === 0) {
                scheduleContainer.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: #666; padding: 20px; background: #f8f9fa; border-radius: 4px;">
                        Aucun tirage programmé. Ajoutez des tirages pour les voir apparaître ici.
                    </div>`;
                return;
            }
            
            const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            
            // Trier par jour
            const sortedSchedule = [...lotterySchedule].sort((a, b) => a.day - b.day);
            
            sortedSchedule.forEach((item) => {
                const itemElement = document.createElement('div');
                itemElement.style.display = 'grid';
                itemElement.style.gridTemplateColumns = '80px 1fr 80px';
                itemElement.style.gap = '10px';
                itemElement.style.alignItems = 'center';
                itemElement.style.padding = '8px';
                itemElement.style.borderBottom = '1px solid #e1e5e9';
                
                itemElement.innerHTML = `
                    <span>${days[parseInt(item.day)]}</span>
                    <span>${item.name}</span>
                    <button type="button" onclick="removeLotteryFromSchedule('${item.id}')" 
                            style="color: #ff4d4f; background: none; border: 1px solid #ff4d4f; border-radius: 4px; padding: 4px 8px; cursor: pointer;">
                        Supprimer
                    </button>
                `;
                
                scheduleContainer.appendChild(itemElement);
            });
        }

        function removeLotteryFromSchedule(id) {
            if (!id) return;
            
            const index = lotterySchedule.findIndex(item => item.id === id);
            if (index !== -1) {
                lotterySchedule.splice(index, 1);
                updateLotteryScheduleDisplay();
                showMessage('Tirage supprimé du planning', 'info');
            }
        }

        // ===== FONCTIONS PRINCIPALES =====
        function activateSession() {
            const select = document.getElementById('sessionSelect');
            const sessionId = select ? select.value : null;
            
            if (!sessionId) {
                showMessage('Veuillez sélectionner une session', 'error');
                return;
            }
            
            showMessage('Activation de la session en cours...', 'info');
            // Implémentation réelle à ajouter ici
        }

        function saveCurrentDraw() {
            showMessage('Sauvegarde du tirage...', 'info');
            // Implémentation réelle à ajouter ici
        }

        function nextDraw() {
            showMessage('Passage au tirage suivant...', 'info');
            // Implémentation réelle à ajouter ici
        }

        function openStatisticalJournal() {
            if (!currentSession) {
                showMessage('Aucune session active. Veuillez d\'abord activer une session.', 'error');
                return;
            }
            showMessage('Ouverture du journal statistique...', 'info');
            // Implémentation réelle à ajouter ici
        }

        // ===== FONCTIONS UTILITAIRES =====
        function initCreateSessionForm() {
            // Initialiser la date du jour
            const today = new Date().toISOString().split('T')[0];
            const startDateInput = document.getElementById('startDate');
            if (startDateInput) {
                startDateInput.value = today;
            }
        }

        async function handleCreateSessionSubmit(e) {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerHTML;
            
            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Création en cours...';
                
                showMessage('Création de la session en cours...', 'info');
                
                // Récupérer les données du formulaire
                const sessionName = document.getElementById('sessionName').value.trim();
                const sessionDescription = document.getElementById('sessionDescription').value.trim();
                const lotteryType = document.getElementById('lotteryType').value.trim();
                const numbersPerDraw = parseInt(document.getElementById('numbersPerDraw').value);
                const totalDraws = parseInt(document.getElementById('totalDraws').value);
                const numberRange = document.getElementById('numberRange').value;
                const startDate = document.getElementById('startDate').value;
                
                if (!sessionName || !lotteryType) {
                    showMessage('Veuillez remplir tous les champs obligatoires', 'error');
                    return;
                }
                
                const sessionData = {
                    name: sessionName,
                    description: sessionDescription,
                    lottery_type: lotteryType,
                    numbers_per_draw: numbersPerDraw,
                    total_draws: totalDraws,
                    number_range: numberRange,
                    start_date: startDate,
                    schedule: [...lotterySchedule]
                };
                
                console.log('Création de la session avec les données:', sessionData);
                
                // Ici vous ajouterez l'appel API réel
                showMessage('✅ Session créée avec succès (simulation)', 'success');
                closeCreateSessionModal();
                
                // Recharger les sessions
                await loadSessions();
                
            } catch (error) {
                console.error('Erreur création session:', error);
                showMessage('Erreur: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        }

        function showMessage(message, type) {
            let container = document.getElementById('messageContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'globalMessageContainer';
                container.style.position = 'fixed';
                container.style.bottom = '20px';
                container.style.right = '20px';
                container.style.zIndex = '9999';
                document.body.appendChild(container);
            }

            const className = type === 'success' ? 'success-message' : 
                            type === 'info' ? 'success-message' : 'error-message';

            container.innerHTML = `<div class="${className}">${message}</div>`;
            
            setTimeout(() => {
                if (container) {
                    container.innerHTML = '';
                }
            }, 5000);
        }
